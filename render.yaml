# Render Blueprint for the real MyMusic web server (API + web app + admin).
# Render asks for three values when you create the Blueprint:
#   MONGODB_URI     your MongoDB Atlas connection string
#   ADMIN_EMAIL     the email you will use to sign in to /admin
#   ADMIN_PASSWORD  at least 12 characters
# Everything else is generated or optional. Add optional keys later under the
# service's Environment tab (YouTube, Stripe, storage, email, Google/Apple sign-in).
services:
  - type: web
    name: mymusic
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OFFLINE_KEY_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # The free plan has no pre-deploy step, so indexes are built at startup.
      - key: DB_AUTO_INDEX
        value: "true"
